name: Release desktop app

# Push a tag to cut a release: git tag vX.Y.Z && git push origin vX.Y.Z
# Builds installers on all three OSes, signs updater artifacts, and
# uploads everything to the GitHub Release under fixed names — the
# website's download buttons and the app's own updater both link to
# releases/latest/download/<name>, so those names must never change.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_glob: src-tauri/target/release/bundle/dmg/*.dmg
            asset_name: Guido_mac.dmg
            updater_platform: darwin-x86_64
            updater_asset_name: Guido_mac.app.tar.gz
          - os: windows-latest
            asset_glob: src-tauri/target/release/bundle/nsis/*.exe
            asset_name: Guido_windows.exe
            updater_platform: windows-x86_64
            updater_asset_name: Guido_windows.exe
          - os: ubuntu-22.04
            asset_glob: src-tauri/target/release/bundle/appimage/*.AppImage
            asset_name: Guido_linux.AppImage
            updater_platform: linux-x86_64
            updater_asset_name: Guido_linux.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/tauri-overlay
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev \
            libgtk-layer-shell-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/tauri-overlay/src-tauri

      - run: npm install

      # tauri.conf.json's version field is what app.getVersion() reports
      # and what the updater compares against latest.json (whose own
      # version comes from this same tag, see publish-latest-json below) —
      # it drove blind for releases v0.1.0-v0.1.4 (committed source stuck
      # at "0.1.0" the whole time, so every build reported the same
      # version and the updater's comparison never converged). Deriving it
      # from the tag here means it can't drift out of sync again — no
      # release-time step to remember or forget.
      - name: Set app version from release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            for (const path of ["src-tauri/tauri.conf.json", "package.json"]) {
              const conf = JSON.parse(fs.readFileSync(path, "utf8"));
              conf.version = process.argv[1];
              fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
            }
          ' "$version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A downloaded build has no spikes/vision-detect/.venv — that
      # directory only ever existed on a developer's own checkout — so
      # each vision-detect script gets compiled into a standalone binary
      # here and shipped as a Tauri sidecar (see tauri.conf.json's
      # bundle.externalBin and lib.rs's sidecar_path, which looks for one
      # of these next to the main executable before falling back to the
      # dev .venv). --onefile trades a bit of per-call startup latency
      # (self-extracts to a temp dir each run) for a single binary per
      # script, which is what externalBin expects — revisit if that
      # latency is noticeable in practice.
      - name: Build vision-detect sidecars
        shell: bash
        run: |
          set -euo pipefail
          pip install -r ../vision-detect/requirements.txt pyinstaller
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          for name in verify_step answer_step identify_app plan_step research live_step portal_capture; do
            pyinstaller --onefile --name "$name" \
              --distpath dist-sidecars --workpath build-sidecars --specpath build-sidecars \
              "../vision-detect/$name.py"
            cp "dist-sidecars/$name$ext" "src-tauri/binaries/$name-$triple$ext"
          done

      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename bundle to the fixed release asset name
        shell: bash
        run: cp ${{ matrix.asset_glob }} ${{ matrix.asset_name }}

      # macOS's updater payload (.app.tar.gz) is a separate file from the
      # .dmg people download directly; Windows/Linux reuse the same
      # installer for both, so only mac needs a second upload here.
      - name: Copy macOS updater artifact to its fixed name
        if: matrix.os == 'macos-latest'
        shell: bash
        run: cp src-tauri/target/release/bundle/macos/*.app.tar.gz ${{ matrix.updater_asset_name }}

      # A tag with a hyphen (v0.1.5-rc1) is a test build: marking it a
      # GitHub prerelease keeps it off releases/latest/download/* (the
      # exact URL both the website's download buttons and every existing
      # install's updater hit), so a still-unverified build can be tried
      # for real without pushing it to anyone until a plain vX.Y.Z tag
      # promotes it.
      - name: Upload installer(s) to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            spikes/tauri-overlay/${{ matrix.asset_name }}
            spikes/tauri-overlay/${{ matrix.updater_asset_name }}
          fail_on_unmatched_files: true

      # Collects this platform's {platform key, download url, .sig
      # content} as a workflow artifact (not a release asset) so the
      # publish-latest-json job below can assemble one latest.json out of
      # all three, once every leg of this matrix has finished.
      - name: Record updater signature for latest.json
        shell: bash
        run: |
          sig_path="src-tauri/target/release/bundle"
          case "${{ matrix.os }}" in
            macos-latest) sig_path=$(find "$sig_path/macos" -name "*.app.tar.gz.sig") ;;
            windows-latest) sig_path=$(find "$sig_path/nsis" -name "*.sig") ;;
            ubuntu-22.04) sig_path=$(find "$sig_path/appimage" -name "*.sig") ;;
          esac
          mkdir -p updater-meta
          node -e '
            const fs = require("fs");
            const signature = fs.readFileSync(process.argv[1], "utf8").trim();
            const entry = {
              platform: process.argv[2],
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/${process.argv[3]}`,
              signature,
            };
            fs.writeFileSync(process.argv[4], JSON.stringify(entry));
          ' "$sig_path" "${{ matrix.updater_platform }}" "${{ matrix.updater_asset_name }}" "updater-meta/${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: updater-meta-${{ matrix.os }}
          path: spikes/tauri-overlay/updater-meta/${{ matrix.os }}.json

  publish-latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-meta-*
          path: updater-meta
          merge-multiple: true

      - name: Assemble latest.json
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("updater-meta").filter((f) => f.endsWith(".json"));
            const platforms = {};
            for (const f of files) {
              const { platform, url, signature } = JSON.parse(fs.readFileSync(`updater-meta/${f}`, "utf8"));
              platforms[platform] = { url, signature };
            }
            const manifest = {
              version: process.env.GITHUB_REF_NAME.replace(/^v/, ""),
              notes: "",
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: latest.json
          fail_on_unmatched_files: true
