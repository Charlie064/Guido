<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tutoria (placeholder)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>Tutoria — placeholder landing page</h1>
  <p>
    Real content owned by Pauline — see
    <a href="https://github.com/">docs/planning/website-v0.md</a> for scope.
    This page only exists to prove the Worker + D1 waitlist wiring works.
  </p>

  <form id="waitlist-form">
    <input type="email" name="email" placeholder="you@example.com" required />
    <button type="submit">Join waitlist</button>
  </form>
  <p id="waitlist-status"></p>

  <script>
    document.getElementById("waitlist-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      const status = document.getElementById("waitlist-status");
      const res = await fetch("/api/waitlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      status.textContent = res.ok ? "You're on the list." : "Something went wrong.";
    });
  </script>
</body>
</html>
