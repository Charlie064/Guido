<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230" role="img" aria-label="Tuto the mascot, thinking">
  <defs>
    <linearGradient id="body-thinking" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0fb"/>
      <stop offset="55%" stop-color="#d7c8f0"/>
      <stop offset="100%" stop-color="#f6c7dd"/>
    </linearGradient>
    <radialGradient id="shine-thinking" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-thinking" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadowblur-thinking" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="205" rx="52" ry="10" fill="#5b4b63" opacity="0.16" filter="url(#shadowblur-thinking)"/>

