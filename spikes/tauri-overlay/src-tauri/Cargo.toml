[package]
name = "tauri-overlay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wlroots Wayland compositors (Sway, Hyprland, ...) draw status bars like
# waybar via the wlr-layer-shell protocol, a stacking class Tauri's
# alwaysOnTop (a plain toplevel window) can never render above. This lets
# the overlay promote itself to a layer-shell surface on those compositors
# so it stays on top there too — see init_layer_shell in src/lib.rs. Only
# pulled in on Linux; alwaysOnTop alone is sufficient on macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

