[package]
name = "tauri-overlay"
version = "0.1.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# App-icon extraction (window_icon in src/lib.rs): the OS backends hand
# back raw RGBA, which is encoded once to PNG and inlined as a data URI
# for the webview. Both were already in the dependency tree transitively
# (via tauri), so naming them here adds no new build weight.
png = "0.17"
base64 = "0.22"

# Session-token storage (docs/planning/login-membership-plan.md):
# default "v1" features wrap macOS Keychain, Windows Credential Manager, and
# Linux Secret Service (zbus, pure Rust — no libdbus/libsecret dev headers
# needed) behind one API, matching the plan's platform requirements exactly.
keyring = "4"

# wlroots Wayland compositors (Sway, Hyprland, ...) draw status bars like
# waybar via the wlr-layer-shell protocol, a stacking class Tauri's
# alwaysOnTop (a plain toplevel window) can never render above. This lets
# the overlay promote itself to a layer-shell surface on those compositors
# so it stays on top there too — see init_layer_shell in src/lib.rs. Only
# pulled in on Linux; alwaysOnTop alone is sufficient on macOS/Windows.
#
# x11rb: window_provider.rs's Linux backend (window enumeration + live
# rect re-query for the window-picker capture, see ADR 0005). Talks X11
# directly, which also covers XWayland — Wayland-native enumeration is out
# of scope (see window_provider.rs's module comment).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
x11rb = "0.13"
# WebKitGTK has no built-in permission-prompt UI — an unhandled
# getUserMedia request is silently denied by its default action (see
# init_media_permissions in lib.rs). Already in the tree transitively via
# wry/tauri (Cargo.lock pins 2.0.2), named directly here to reach its
# `permission-request` signal.
webkit2gtk = "2.0"

# CGWindowListCopyWindowInfo (window_provider.rs) only needs Core
# Foundation's CFArray/CFDictionary/CFString/CFNumber wrappers — the
# CGWindowList call itself is declared as a raw extern against the
# CoreGraphics framework directly, not through the `core-graphics` crate,
# so this doesn't depend on that crate's own symbol names.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# EnumWindows/DwmGetWindowAttribute/QueryFullProcessImageNameW
# (window_provider.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
] }

