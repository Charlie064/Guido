<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Spike</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      .box {
        position: absolute;
        top: 220px;
        left: 380px;
        width: 220px;
        height: 90px;
        border: 3px solid #ff3b3b;
        border-radius: 6px;
        box-shadow: 0 0 0 2px rgba(255, 59, 59, 0.3);
      }
      .bubble {
        position: absolute;
        top: 130px;
        left: 380px;
        max-width: 260px;
        background: #1a2029;
        color: #f6f7f5;
        font: 14px system-ui, sans-serif;
        padding: 8px 12px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="bubble">This is the Color tab — click here to open grading tools.</div>
    <div class="box"></div>
  </body>
</html>
