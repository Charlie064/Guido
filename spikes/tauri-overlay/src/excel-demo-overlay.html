<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>guido-excel-demo-overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        pointer-events: none;
      }
      #stage { position: relative; width: 100%; height: 100%; }

      .hit {
        position: absolute;
        border-radius: 18px;
        border: 1.5px solid rgba(168, 22, 86, 0.55);
        background:
          linear-gradient(165deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 236, 244, 0.42) 48%, rgba(255, 46, 154, 0.18) 100%);
        backdrop-filter: blur(16px) saturate(1.25);
        -webkit-backdrop-filter: blur(16px) saturate(1.25);
        box-shadow:
          0 14px 32px -14px rgba(10, 10, 10, 0.38),
          0 0 0 4px rgba(196, 181, 253, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .hit::after {
        content: "";
        position: absolute;
        inset: 5px 6px auto;
        height: 38%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        pointer-events: none;
      }
      .hit-n {
        position: absolute;
        top: -11px;
        left: -11px;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff 0%, #ffe4f1 100%);
        border: 1.5px solid rgba(150, 18, 78, 0.5);
        color: #0A0A0A;
        font: 700 12px/1 "Space Grotesk", Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 6px 14px -6px rgba(10, 10, 10, 0.4),
          0 0 0 3px rgba(196, 181, 253, 0.22);
      }

      .callout {
        position: absolute;
        width: min(280px, 30vw);
        padding: 10px 12px 12px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 240, 247, 0.78) 100%);
        backdrop-filter: blur(20px) saturate(1.3);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        border: 1.5px solid rgba(150, 18, 78, 0.32);
        box-shadow:
          0 18px 40px -16px rgba(10, 10, 10, 0.42),
          0 0 0 4px rgba(196, 181, 253, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .callout-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .callout-mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        object-fit: cover;
        border: 1.5px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 0 0 3px rgba(196, 181, 253, 0.18), 0 3px 8px -2px rgba(0, 0, 0, 0.16);
        flex-shrink: 0;
      }
      .callout-n {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, #ffe4f1);
        border: 1.5px solid rgba(150, 18, 78, 0.45);
        color: #0A0A0A;
        font: 700 11px/20px "Space Grotesk", Inter, system-ui, sans-serif;
        text-align: center;
        flex-shrink: 0;
      }
      .callout-kicker {
        font: 600 11px/1.2 "Space Grotesk", Inter, system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: #0A0A0A;
        min-width: 0;
      }
      .callout-text {
        font: 12px/1.45 Inter, system-ui, sans-serif;
        color: #525252;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="excel-demo-overlay.js"></script>
  </body>
</html>
